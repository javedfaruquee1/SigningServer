name: SBOM Scan with EPSS Enrichment

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  sbom-enriched-scan:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v3

      - name: 🛠️ Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: 📦 Install Syft and Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: 🧰 Install Bomber
        run: |
          curl -sSL https://github.com/devops-kung-fu/bomber/releases/download/v0.5.1/bomber_0.5.1_linux_amd64.tar.gz -o bomber.tar.gz
          tar -xzf bomber.tar.gz
          chmod +x bomber
          sudo mv bomber /usr/local/bin
          
      - name: 📝 Generate SBOM with Syft
        run: |
          echo "Generating SBOM using Syft..."
          syft scan . -o cyclonedx-json > sbom.cdx.json
          echo "📝 SBOM (first 50 lines):"
          head -n 50 sbom.cdx.json

      - name: 🕵️ Scan SBOM with Grype
        run: |
          echo "Scanning SBOM with Grype..."
          grype sbom:sbom.cdx.json -o json > grype-results.json
          echo "🛡 Vulnerabilities (first 50 lines):"
          head -n 50 grype-results.json

      - name: 🧠 Enrich with EPSS & scan SBOM (Bomber)
        run: |
          echo "Running Bomber with EPSS enrichment..."
          bomber scan sbom.cdx.json --output json,table --enrich epss > bomber-results.json
          echo "📈 Bomber Results:"
          cat bomber-results.json | jq '.findings[0:5]'

      - name: 🔍 Enrich vulnerabilities with EPSS
        run: |
          echo "Enriching Grype results with EPSS scores..."
          curl -sSfL https://epss.cyentia.com/epss_scores-current.csv.gz -o epss.csv.gz
          gunzip epss.csv.gz
          
          jq -r '.matches[].vulnerability.id' grype-results.json | sort -u > cves.txt
          echo '{"vulnerabilities":[' > grype-results-enriched.json
          first=1
          while read -r cve; do
            score=$(awk -F, -v id="$cve" '$1 == id {print $3}' epss.csv)
            if [ -n "$score" ]; then
              [ $first -eq 0 ] && echo "," >> grype-results-enriched.json
              first=0
              echo "{\"id\":\"$cve\",\"epss\":\"$score\"}" >> grype-results-enriched.json
            fi
          done < cves.txt
          echo "]}" >> grype-results-enriched.json
          
          echo "📈 Enriched results (first 50 lines):"
          head -n 50 grype-results-enriched.json

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-enriched-results
          path: |
            sbom.cdx.json
            grype-results.json
            grype-results-enriched.json
            bomber-results.json
